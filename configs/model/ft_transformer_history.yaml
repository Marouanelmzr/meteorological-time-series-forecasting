_target_: src.models.classification.ft_transformer_history.FTTransformerWithHistoryClassifier

lr: 3e-4
batch_size: 1024
epochs: 100
patience: 10

monitor_metric: pr_auc

scheduler: cosine

weight_decay: 1e-5

d_token: 192
n_blocks: 3
attention_n_heads: 8
ffn_d_hidden_multiplier: 4.0

attention_dropout: 0.2
ffn_dropout: 0.1
residual_dropout: 0.0

tab_embed_dim: 128
seq_input_dim: 6        # wind, temp, pressure, wind_dir_sin, wind_dir_cos, hours_before_run
seq_hidden_dim: 64
seq_num_layers: 1
fusion_hidden_dim: 128
fusion_dropout: 0.1

focal_alpha: 0.97
focal_gamma: 2.0

categorical_columns: ${features.categorical_columns}